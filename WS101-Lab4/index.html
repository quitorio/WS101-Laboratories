<!DOCTYPE html>
<html>
<head>
    <title>Weather App (QUITORIO)</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-family: sans-serif;
        color: rgb(1, 1, 1);
    }
    .top-bar {
        display: flex;
        flex-direction: row;
        align-items: center;
        margin-bottom: 2rem;
        gap: 1rem;
    }
    #cityInput {
        padding: 0.5rem 1rem;
        font-size: 1.2rem;
        width: 14rem;
        border-radius: 8px;
        border: 1px solid #ccc;
    }
    #searchBtn {
        padding: 0.5rem 0.5rem;
        font-size: 1.1rem;
        border-radius: 8px;
        border: none;
        background: #333;
        color: #fff;
        cursor: pointer;
    }
    .container {
        height: 20rem;
        width: 20rem;
        background-color: rgb(255, 255, 255);
        text-align: center;
        padding-top: 12px;
        border-radius: 16px;
        margin-top: 1.5rem; 
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .icon, .temp, .summary, .location, .date {
        width: 100%;
        text-align: center;
        margin-bottom: 1rem;
    }
    </style>
</head>
<body>
    <div class="top-bar">
        <input type="text" id="cityInput" placeholder="Enter city name" />
        <button id="searchBtn">Search</button>
    </div>
    <div class="container">
        <div class="date" style="font-size: 1.4rem;"></div>
        <div class="temp"></div>
        <div class="summary" style="text-transform: capitalize;"></div>
        <div class="location"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
